<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>OpenEarable - Dashboard</title>

    <!-- CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css"
      integrity="sha512-oAvZuuYVzkcTc2dH5z1ZJup5OmSQ000qlfRvuoTTiyTBjwX1faoyearj8KdMq0LgsBTHMrRuMek7s+CxF8yE+w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      /* General Styles */
      body {
        background: #161618;
        color: white !important;
        transition: background-color 0.5s;
      }

      .bg-green {
        background-color: #3f3f44;
      }

      .bg-red {
        background-color: #161618;
      }

      .card {
        border-color: transparent;
        border-width: 0px;
        overflow: hidden;
        background: #36353b;
        color: b0b0b0;
      }

      .card-title {
        color: white;
      }

      .btn {
        border-width: 0px;
      }

      .btn:hover {
        border-width: 0px;
        opacity: 0.9;
      }

      .btn:disabled {
        opacity: 0.5;
      }

      a {
        color: white !important;
      }

      a:hover {
        color: white;
        opacity: 0.8;
      }

      /* Tooltip */
      .tooltip-indicator {
        background: white;
        min-width: 17px;
        min-height: 17px;
        max-width: 17px;
        max-height: 17px;
        border-radius: 50%;
        font-size: 0.8em;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        color: black;
      }

      .tooltip-inner {
        background-color: white !important;
        color: black;
      }

      .tooltip .tooltip-arrow::before {
        --bs-tooltip-bg: white;
      }

      /* Connection Card */
      .btn-connect {
        background-color: #77f2a1 !important;
        color: black !important;
      }

      .btn-disconnect {
        background-color: #f27777 !important;
        color: black !important;
        display: none;
        /* default is hidden */
      }

      /* Audio Player Card */
      .btn-audio-controls {
        font-size: 1.3em;
      }

      .btn-play {
        background-color: #77f2a1 !important;
        color: black !important;
        font-size: 1.2em;
      }

      .btn-pause {
        background-color: #e0f277 !important;
        color: black !important;
        font-size: 1.2em;
      }

      .btn-stop {
        background-color: #f27777 !important;
        color: black !important;
      }

      /* Sensor Control Card */
      .btn-control {
        background-color: #53515b !important;
        color: white !important;
      }

      /* Log card */
      .btn-clear {
        background-color: white !important;
        padding: 2px 4px;
        font-size: 0.8em;
        color: black !important;
      }

      /* Sensor Chart Cards */
      .chartWrapper {
        max-height: 180px;
        width: 100%;
        height: 100%;
      }

      .btn-confirm {
        background: #77f2a1 !important;
        color: black !important;
        border-radius: 0px 5px 5px 0px;
        border: 0px solid transparent;
        margin: 1px;
        font-size: 1.4em;
        line-height: 1em;
      }

      .btn-edit-input {
        max-width: 120px;
      }

      .sampling-rate-input {
        min-width: 100px;
      }

      .form-select,
      .form-control {
        padding: 0px 5px;
      }

      input[disabled],
      select[disabled] {
        opacity: 0.5 !important;
      }
    </style>
  </head>

  <body class="pt-1 pb-1">
    <div class="container-fluid d-flex flex-column" style="min-height: 100%">
      <div class="row gx-2">
        <div
          class="col-12 col-md-6 col-xl-2 d-flex align-items-stretch flex-column mt-2"
        >
          <div class="card mt-2 flex-fill">
            <div class="card-body d-flex flex-column justify-content-between">
              <div class="d-flex flex-row w-100 justify-content-between">
                <h5 class="card-title">Device</h5>
                <div
                  class="tooltip-indicator"
                  data-toggle="tooltip"
                  title="OpenEarable connects via WebBLE. Make sure your browser supports WebBLE (e.g., Chrome version ≥ 56)."
                >
                  <div>?</div>
                </div>
              </div>
              <div class="d-flex flex-column">
                <div class="card-text">
                  <span id="connectedDevice" style="font-family: monospace"
                    >Device-XXXX</span
                  >
                  (<span id="batteryLevel" style="font-family: monospace"
                    >XX</span
                  >%<i
                    id="batteryChargingIndicator"
                    class="bi bi-lightning-charge"
                  ></i
                  ><i
                    id="batteryChargedIndicator"
                    style="color: #77f2a1"
                    class="bi bi-lightning-charge-fill"
                  ></i
                  >)
                </div>
                <div class="mt-1">
                  <b>Firmware</b>
                  <span id="fwVersion" style="font-family: monospace"
                    >X.X.X</span
                  >
                  <b class="ms-2">Device</b>
                  <span id="deviceVersion" style="font-family: monospace"
                    >X.X.X</span
                  >
                </div>
              </div>
              <div>
                <button id="connectDeviceButton" class="btn btn-connect w-100">
                  Connect
                </button>
                <button
                  id="disconnectDeviceButton"
                  class="btn btn-disconnect w-100"
                >
                  Disconnect
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4 mt-2">
          <div class="card h-100">
            <div class="card-body h-100 flex-column d-flex">
              <div class="d-flex flex-row w-100 justify-content-between">
                <h5 class="card-title">Sensor Control</h5>
                <div
                  class="tooltip-indicator"
                  data-toggle="tooltip"
                  title="Enable and disable the sensors of OpenEarable. Note that sampling all sensors at the maximum sampling rate can lead to lag and/or audio play issues. Inner / outer microphone and gain control (g-dB) only available with hardware and firmware verison ≥ 1.4."
                >
                  <div>?</div>
                </div>
              </div>
              <div class="d-flex flex-column flex-fill justify-content-between">
                <p class="card-text">
                  Select sensors and sampling rate to capture.
                </p>
                <div
                  style="
                    display: grid;
                    grid-template-columns: auto 1fr auto auto;
                    gap: 16px;
                    align-items: center;
                  "
                >
                  <div>
                    <input
                      type="checkbox"
                      id="areSensorsEnabled"
                      class="is-connect-enabled"
                      disabled
                    />
                  </div>
                  <div
                    class="ms-2"
                    style="
                      overflow: hidden;
                      white-space: nowrap;
                      text-overflow: ellipsis;
                    "
                  >
                    Accelerometer, Gyroscope, Magnetometer (via BLE)
                  </div>
                  <div>
                    <select
                      id="sensorSamplingRate"
                      name="sensorSamplingRate"
                      class="form-select ms-1 sampling-rate-input is-connect-enabled"
                      disabled
                    >
                      <option value="0">0</option>
                      <option value="10">10</option>
                      <option value="20">20</option>
                      <option value="30">30</option>
                      <option value="40">40</option>
                      <option value="50">50</option>
                    </select>
                  </div>
                  <div class="ms-1">Hz</div>
                </div>
                <div class="d-flex flex-row mt-3 w-100 justify-content-between">
                  <button
                    id="setSensorConfigurationButton"
                    class="btn btn-control flex-fill is-connect-enabled"
                    disabled
                  >
                    Set Configuration
                  </button>
                  <button
                    id="testOcclusionButton"
                    class="btn btn-control ms-3 is-connect-enabled"
                    style="min-width: 120px"
                    disabled
                  >
                    Test Occl.
                  </button>
                  <button
                    class="btn btn-stop ms-3 is-connect-enabled btn-disable-sensors"
                    disabled
                  >
                    Off
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row gx-2 flex-grow-1">
        <div class="col-12 col-md-6 col-xl-4 mt-2">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <div class="d-flex flex-row w-100 justify-content-between">
                <h5 class="card-title">Accelerometer</h5>
                <div
                  class="tooltip-indicator"
                  data-toggle="tooltip"
                  title="This panel shows live data once the accelerometer is activated."
                >
                  <div>?</div>
                </div>
              </div>
              <div class="chartWrapper">
                <canvas id="accelerometerChart" class="w-100"></canvas>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4 mt-2">
          <div class="card h-100">
            <div class="card-body">
              <div class="d-flex flex-row w-100 justify-content-between">
                <h5 class="card-title">Gyroscope</h5>
                <div
                  class="tooltip-indicator"
                  data-toggle="tooltip"
                  title="This panel shows live data once the gyroscope is activated."
                >
                  <div>?</div>
                </div>
              </div>
              <div class="chartWrapper">
                <canvas id="gyroscopeChart" class="w-100"></canvas>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4 mt-2">
          <div class="card h-100">
            <div class="card-body">
              <div class="d-flex flex-row w-100 justify-content-between">
                <h5 class="card-title">Magnetometer</h5>
                <div
                  class="tooltip-indicator"
                  data-toggle="tooltip"
                  title="This panel shows live data once the magnetometer is activated."
                >
                  <div>?</div>
                </div>
              </div>
              <div class="chartWrapper">
                <canvas id="magnetometerChart" class="w-100"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- HIC panel -->
      <div class="row gx-2 mb-2">
        <div class="col-12 col-md-6 col-xl-4 mt-2">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <div class="d-flex flex-row w-100 justify-content-between">
                <h5 class="card-title">Head Injury Criterion (HIC)</h5>
                <div
                  class="tooltip-indicator"
                  data-toggle="tooltip"
                  title="HIC computed over a sliding 15 ms window: Δt·[avg a]^2.5"
                >
                  <div>?</div>
                </div>
              </div>
              <div
                class="d-flex align-items-center justify-content-center flex-fill"
              >
                <h1 id="hicValue" class="m-0">0.00</h1>
              </div>
              <div class="chartWrapper">
                <canvas id="hicChart" class="w-100"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- /.container-fluid -->

    <!-- JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Note: keep import order -->
    <script src="./assets/js/LogManager.js"></script>
    <script src="./assets/js/OpenEarable.js"></script>
    <script src="./assets/js/LEDManager.js"></script>
    <script src="./assets/js/ConnectionManager.js"></script>
    <script src="./assets/js/ChartManager.js"></script>
    <script src="./assets/js/RecordingManager.js"></script>
    <script src="./assets/js/AudioManager.js"></script>
    <script src="./assets/js/SensorManager.js"></script>
    <script src="./assets/js/HICManager.js"></script>

    <script>
      /* initialization tasks */

      // Function to map dB values to linear values
      function mapLinear(db, minDb, maxDb, minLinear, maxLinear) {
        return (
          ((db - minDb) * (maxLinear - minLinear)) / (maxDb - minDb) + minLinear
        );
      }

      $(document).ready(function () {
        $("#batteryChargingIndicator").hide();
        $("#batteryChargedIndicator").hide();

        // enable tooltips
        $(function () {
          $('[data-toggle="tooltip"]').tooltip();
        });

        // disable all buttons on initial load
        $(".is-connect-enabled").prop("disabled", true);

        // check if bluetooth is supported
        if ("bluetooth" in navigator) {
          log(
            "Your browser supports WebBLE. You are ready to connect to OpenEarable!"
          );
        } else {
          log(
            "Your browser does not support WebBLE. Enable it or download a browser that supports WebBLE (e.g., Chrome version ≥ 56)!",
            "ERROR"
          );
        }

        const selectInner = document.getElementById("microphoneGainInner");
        const selectOuter = document.getElementById("microphoneGainOuter");
        const minDb = -20,
          maxDb = 20,
          step = 0.5,
          minLinear = 0,
          maxLinear = 80;

        for (let db = minDb; db <= maxDb; db += step) {
          const linearValue = mapLinear(db, minDb, maxDb, minLinear, maxLinear);
          [selectInner, selectOuter].forEach((sel) => {
            const opt = document.createElement("option");
            opt.value = linearValue.toFixed(0);
            opt.textContent = db.toFixed(1);
            sel.appendChild(opt);
          });
        }
        selectInner.selectedIndex = 40;
        selectOuter.selectedIndex = 40;
      });
    </script>
  </body>
</html>
